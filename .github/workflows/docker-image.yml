name: Docker Image CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  LIBMONGOCRYPT_VERSION: "1.21.1"

jobs:
  test-code:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:9
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'" 
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7
        name: Checkout code

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
        name: Setup Go

      - name: Restore libmongocrypt build
        id: cache-libmongocrypt
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/local_install
          key: ${{ runner.os }}-libmongocrypt-${{ env.LIBMONGOCRYPT_VERSION }}

      - name: Install libraries
        if: steps.cache-libmongocrypt.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget cmake libssl-dev build-essential ninja-build libsasl2-dev

      - name: Checkout libmongocrypt
        if: steps.cache-libmongocrypt.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: mongodb/libmongocrypt
          ref: ${{ env.LIBMONGOCRYPT_VERSION }}
          path: libmongocrypt

      - name: Build libmongocrypt
        if: steps.cache-libmongocrypt.outputs.cache-hit != 'true'
        run: |
          cd libmongocrypt
          mkdir cmake-build
          cd cmake-build
          cmake -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/local_install -DBUILD_VERSION=${{ env.LIBMONGOCRYPT_VERSION }} -GNinja ..
          ninja install

      # Only save from master: caches saved by PRs are scoped to that PR and
      # duplicate the master entry. PRs can still restore master's cache.
      - name: Save libmongocrypt build
        if: github.ref == 'refs/heads/master' && steps.cache-libmongocrypt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/local_install
          key: ${{ steps.cache-libmongocrypt.outputs.cache-primary-key }}

      - name: Test code
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out -tags cse ./...
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
          LD_LIBRARY_PATH: ${{ github.workspace }}/local_install/lib
          PKG_CONFIG_PATH: ${{ github.workspace }}/local_install/lib/pkgconfig
          CGO_LDFLAGS: "-L${{ github.workspace }}/local_install/lib"
          CGO_CFLAGS: "-I${{ github.workspace }}/local_install/include"

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
